spring.application.name=url-shortener-test
spring.datasource.initialization-mode=always
spring.datasource.continue-on-error=true
server.port=8091
logging.level.com.sed=DEBUG
# H2 In-Memory Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Hibernate/JPA (same as dev, but adapted for H2)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Disable schema initialization for tests (if not needed)
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.mode=never
spring.sql.init.enabled=false
# HikariCP (keep defaults or adjust for tests)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Redis (use a test Redis instance or mock/disable)
spring.redis.host=localhost
spring.redis.port=6379
# AWS LocalStack (disable or mock for tests)
cloud.aws.credentials.access-key=test
cloud.aws.credentials.secret-key=test
cloud.aws.region.static=us-east-1
cloud.aws.stack.auto=false
cloud.aws.s3.endpoint=http://localhost:4566
cloud.aws.sns.endpoint=http://localhost:4566
cloud.aws.sqs.endpoint=http://localhost:4566