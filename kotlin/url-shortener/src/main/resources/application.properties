spring.application.name=url-shortener
spring.datasource.initialization-mode=always
spring.datasource.continue-on-error=true
server.port=8090
logging.level.com.sed=DEBUG
# PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://0.0.0.0:5432/appdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Initialize schema from schema.sql (optional)
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.mode=always
spring.sql.init.enabled=false
### Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
### PostgreSQL Configuration for Docker
### Redis Configuration
spring.redis.host=0.0.0.0
spring.redis.port=6379
### AWS LocalStack Configuration
cloud.aws.credentials.access-key=test
cloud.aws.credentials.secret-key=test
cloud.aws.region.static=us-east-1
cloud.aws.stack.auto=false
cloud.aws.s3.endpoint=http://localstack:4566
cloud.aws.sns.endpoint=http://localstack:4566
cloud.aws.sqs.endpoint=http://localstack:4566